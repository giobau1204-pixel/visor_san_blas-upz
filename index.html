<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geovisor - Acceso a Alimentos UPZ San Blas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); max-width: 300px;
        }
        .info-panel h2 { font-size: 16px; margin-top: 0; color: #1e3a8a; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="info-panel">
        <h2>UPZ 32 San Blas</h2>
        <p><b>Análisis Multicriterio (IPT)</b></p>
        <div class="legend">
            <i style="background: #023858;"></i> Alta Prioridad (IPT Alto)<br>
            <i style="background: #74a9cf;"></i> Prioridad Media<br>
            <i style="background: #ece7f2;"></i> Baja Prioridad<br>
            <i style="background: #d9d9d9;"></i> No Aplica (Estrato 0)<br>
        </div>
        <p style="font-size: 11px; color: #666; margin-top: 10px;">Haga clic sobre una manzana para consultar sus métricas.</p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        // Inicializar el mapa centrado en la UPZ San Blas (Bogotá)
        var map = L.map('map').setView([4.575, -74.075], 14);

        // Mapa Base público de Esri (Libre de restricciones y sin API Key)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Taiwan), and the GIS User Community',
            maxZoom: 19
        }).addTo(map);

        // Función de color según el IPT (simulando QGIS)
        function getColor(ipt) {
            return ipt > 0.35 ? '#023858' :
                   ipt > 0.31 ? '#3690c0' :
                   ipt > 0.28 ? '#67a9cf' :
                   ipt > 0.00 ? '#ece7f2' : '#d9d9d9'; // Gris para Estrato 0 / No Aplica
        }

        function style(feature) {
            return {
                fillColor: getColor(feature.properties.ipt),
                weight: 1,
                opacity: 1,
                color: 'white',
                fillOpacity: 0.75
            };
        }

        // Cargar el GeoJSON exportado desde QGIS
        $.getJSON("datos_san_blas.geojson", function (data) {
            var geojsonLayer = L.geoJson(data, {
                style: style,
                onEachFeature: function (feature, layer) {
                    var p = feature.properties;
                    var popupContent = `
                        <b>Manzana Catastral</b><br>
                        <b>Código:</b> ${p.CODIGO_MANZANA || 'N/A'}<br>
                        <b>Estrato:</b> ${p.ESTRATO !== undefined ? p.ESTRATO : 'N/A'}<br>
                        <hr style="margin:5px 0;">
                        <b>Dist. Tiendas:</b> ${p.dist_tiendas ? p.dist_tiendas + ' m' : 'N/A'}<br>
                        <b>Dist. Paraderos:</b> ${p.dist_paraderos ? p.dist_paraderos + ' m' : 'N/A'}<br>
                        <b>ICA (Acceso Físico):</b> ${p.ica !== null ? p.ica : 'N/A'}<br>
                        <b>IPT (Prioridad):</b> ${p.ipt !== null ? p.ipt : 'No Aplica'}<br>
                    `;
                    layer.bindPopup(popupContent);
                }
            }).addTo(map);

            // Ajustar el zoom del mapa automáticamente a los límites de San Blas
            map.fitBounds(geojsonLayer.getBounds());
        });
    </script>
</body>
</html>
